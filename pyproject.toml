[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsqa"
version = "0.1.0"
description = "LangGraph RAG over distributed systems research papers"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "langgraph>=0.2.0",
  "chromadb>=0.5.0",
  "pdfplumber>=0.11.0",
  "pymupdf>=1.24.0",
  "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]
cloud = ["anthropic", "openai"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
dsqa = "dsqa.cli:main"

[tool.setuptools.packages.find]
include = ["dsqa*"]

[tool.setuptools.package-data]
dsqa = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
pretty = true
